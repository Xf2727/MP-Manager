name: Build Codex Manager

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Adjust app to SDK 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/build.gradle')
          text = path.read_text(encoding='utf-8')
          text = re.sub(r'\bcompileSdk\s+37\b', 'compileSdk 36', text)
          text = re.sub(r'\btargetSdk\s+37\b', 'targetSdk 36', text)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare release signing key
        env:
          CODEX_KEYSTORE_BASE64: ${{ secrets.CODEX_KEYSTORE_BASE64 }}
        run: |
          test -n "$CODEX_KEYSTORE_BASE64" || { echo "::error::Configure CODEX_KEYSTORE_BASE64 in repository Actions secrets"; exit 1; }
          printf '%s' "$CODEX_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/codexmanager-release.p12"
          echo "CODEX_SIGNING_STORE=$RUNNER_TEMP/codexmanager-release.p12" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          CODEX_STORE_PASSWORD: ${{ secrets.CODEX_STORE_PASSWORD }}
          CODEX_KEY_ALIAS: ${{ secrets.CODEX_KEY_ALIAS }}
          CODEX_KEY_PASSWORD: ${{ secrets.CODEX_KEY_PASSWORD }}
        run: |
          test -n "$CODEX_STORE_PASSWORD" || { echo "::error::Configure CODEX_STORE_PASSWORD in repository Actions secrets"; exit 1; }
          test -n "$CODEX_KEY_ALIAS" || { echo "::error::Configure CODEX_KEY_ALIAS in repository Actions secrets"; exit 1; }
          test -n "$CODEX_KEY_PASSWORD" || { echo "::error::Configure CODEX_KEY_PASSWORD in repository Actions secrets"; exit 1; }
          bash ./gradlew :app:assembleRelease --stacktrace

      - name: Name APK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          import shutil

          text = Path('app/build.gradle').read_text(encoding='utf-8')
          version = re.search(r'versionName\s+"([^"/\\]+)"', text).group(1)
          apk = Path('app/build/outputs/apk/release/app-release.apk')
          output = Path('dist')
          output.mkdir(exist_ok=True)
          name = f'Codex Manager-{version}.apk'
          shutil.copy2(apk, output / name)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f'APK_NAME={name}\n')
          PY

      - name: Publish downloadable APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_PROMPT_DISABLED: '1'
        run: |
          if ! gh release view latest-build >/dev/null 2>&1; then
            gh release create latest-build --target "$GITHUB_SHA" --title "Codex Manager - Latest Build" --notes "Automatically built by GitHub Actions. Download the APK asset below." --prerelease
          fi
          gh release upload latest-build "dist/$APK_NAME" --clobber
          gh release edit latest-build --title "${APK_NAME%.apk}" --notes "Automatically built by GitHub Actions from commit $GITHUB_SHA. Download the APK asset below."
          python3 - <<'PY'
          import os
          from urllib.parse import quote
          name = os.environ['APK_NAME']
          repo = os.environ['GITHUB_REPOSITORY']
          url = f"https://github.com/{repo}/releases/download/latest-build/{quote(name)}"
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(f'### Build complete\n\n[Download {name}]({url})\n')
          PY
